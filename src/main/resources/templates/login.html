<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<main class="auth">
  <div class="card auth-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Vendor portal</div>
    <h1>Sign in</h1>
    <p class="muted">We'll email you a 6-digit code.</p>

    <div class="alert alert-bad" role="alert" th:if="${error}" th:text="${error}">Enter your email address.</div>
    <div class="alert alert-ok" role="status" th:if="${param.signedout}">You have signed out.</div>

    <form th:action="@{/login/code}" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus maxlength="150">
      </div>
      <button class="btn btn-primary" type="submit">Email me a code</button>
    </form>
    <p class="small muted auth-foot">Only addresses listed for the vendor team can sign in.</p>
  </div>
</main>
</body>
</html>
