# The server. Set SPRING_PROFILES_ACTIVE=prod and these variables: DB_URL, DB_USERNAME, DB_PASSWORD,
# PUBLIC_URL, SIGNING_PRIVATE_KEY, MAILJET_SMTP_USERNAME, MAILJET_SMTP_PASSWORD, VENDOR_ADMIN_EMAIL (first start),
# PAYSTACK_SECRET_KEY (online payment). See README.md.

# MySQL, e.g. jdbc:mysql://host:3306/vendor_portal?serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF

spring.thymeleaf.cache=true

# https only
server.servlet.session.cookie.secure=true
# This portal's https address (linking instructions, invoice pay links, Paystack's return address)
app.public-url=${PUBLIC_URL}

# Never print sign-in codes on a server
app.login.log-codes=false
