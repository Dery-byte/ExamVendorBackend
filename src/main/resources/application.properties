spring.application.name=vendor-portal
# dev = your computer (local MySQL); prod = the server (set SPRING_PROFILES_ACTIVE=prod there)
spring.profiles.active=dev
# Local secrets (database login, Mailjet, Paystack …) live in a git-ignored .env file in the folder the
# server is started from, as in the exam portal. Real environment variables still take priority. See .env.example.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8090}
# Behind Render / a proxy: trust X-Forwarded-* for https and the caller's address
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# MAILJET SMTP CONFIGURATION (the same account as the exam portal): sign-in codes are emailed
spring.mail.host=${MAILJET_SMTP_HOST:in-v3.mailjet.com}
spring.mail.port=${MAILJET_SMTP_PORT:587}
spring.mail.username=${MAILJET_SMTP_USERNAME:}
spring.mail.password=${MAILJET_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Sender: an address verified in Mailjet (the exam portal's)
app.mail.from-address=${MAIL_FROM_ADDRESS:optimusinforservice@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Vendor portal}

# Sign-in: only the emails in the vendor_user table, with a code emailed to them (like the exam portal's
# developer_email). This address is added on start-up while the table is still empty.
app.admin.email=${VENDOR_ADMIN_EMAIL:}

# Signs subscription keys: the online key (subscription-tool/keys-online/private.key), as its base64 text
# or as the path of the file. Its public half is built into the exam portal (SubscriptionKeys.PUBLIC_KEYS).
app.signing.private-key=${SIGNING_PRIVATE_KEY:}
app.signing.private-key-file=${SIGNING_PRIVATE_KEY_FILE:}

# Paystack: online payment of invoices (sk_test_... while testing, sk_live_... in production).
# Webhook URL to set in Paystack: <PUBLIC_URL>/api/v1/paystack/webhook
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
# Your business name on the public invoice pages
app.vendor-name=${VENDOR_NAME:Exam Portal subscriptions}
# A client that hasn't checked in for this long is flagged on the dashboard
app.silent-after-hours=${SILENT_AFTER_HOURS:36}
