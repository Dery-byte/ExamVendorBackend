# The server. Set SPRING_PROFILES_ACTIVE=prod and these variables: DB_URL, DB_USERNAME, DB_PASSWORD,
# SIGNING_PRIVATE_KEY, MAILJET_SMTP_USERNAME, MAILJET_SMTP_PASSWORD, VENDOR_ADMIN_EMAIL, PAYSTACK_SECRET_KEY
# (online payment), and PUBLIC_URL unless Render provides RENDER_EXTERNAL_URL. On start-up the log shows a
# "[CONFIG]" summary of what was found. See README.md.

# MySQL, e.g. jdbc:mysql://host:3306/vendor_portal?serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF

spring.thymeleaf.cache=true

# https only
server.servlet.session.cookie.secure=true
# This portal's https address (linking instructions, invoice pay links, Paystack's return address).
# On Render, RENDER_EXTERNAL_URL (set by Render, e.g. https://vendor-portal.onrender.com) is used when PUBLIC_URL isn't.
app.public-url=${PUBLIC_URL:${RENDER_EXTERNAL_URL:}}

# Never print sign-in codes on a server
app.login.log-codes=false
