# Your computer.

# The vendor portal's own database on your local MySQL, next to the exam portal's Exam_portal.
# Created on first start. DB_USERNAME / DB_PASSWORD come from .env.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vendor_portal?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false

# Templates are re-read on every request while developing
spring.thymeleaf.cache=false

# Plain http://localhost, so the session cookie can't require https
server.servlet.session.cookie.secure=false
app.public-url=${PUBLIC_URL:http://localhost:8090}

# The signing key file next door (keep a copy there for local use, or point SIGNING_PRIVATE_KEY_FILE elsewhere)
app.signing.private-key-file=${SIGNING_PRIVATE_KEY_FILE:../subscription-tool/keys-online/private.key}

# Sign-in codes are also printed in the console, so you can sign in even if an email is slow (local only)
app.login.log-codes=${VENDOR_LOG_CODES:true}
